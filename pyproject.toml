[project]
name = "tesco"
version = "1.4.0"
description = "End-to-end data engineering project on a synthetic UK retail dataset: CSVs to Postgres to a Databricks catalog via CDC"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apache-airflow>=3.3.1",
    "databricks-sdk>=0.117.0",
    "dbt-core<1.12",
    "dbt-databricks>=1.12.4",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
]
