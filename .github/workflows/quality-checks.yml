name: Quality checks

on:
  pull_request:
  push:
    branches: [master]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run pre-commit hooks on all files
        uses: pre-commit/action@v3.0.1
        # This runs the exact hooks defined in .pre-commit-config.yaml.
        # It runs on GitHub's infrastructure, so it applies no matter what
        # any individual contributor has (or hasn't) set up locally.

  large-file-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Block large binaries outside git-lfs
        run: |
          # Blob sizes are read straight from the object database, so this needs
          # no diff range and no full history: it behaves identically on pushes
          # and on pull requests. `git ls-tree -l` emits
          # "<mode> <type> <sha> <size>\t<path>", so the path is whatever
          # follows the tab - safe for paths containing spaces.
          oversized=$(git ls-tree -r -l HEAD | awk -F'\t' '
            { split($1, meta, " ") }
            meta[4] + 0 > 5000000 { printf "%s\t%s\n", meta[4], $2 }
          ')
          if [ -n "$oversized" ]; then
            while IFS=$'\t' read -r size path; do
              echo "::error file=$path::File is $size bytes, over the 5MB limit - use git-lfs or DVC for mlflow artefacts instead of committing directly."
            done <<< "$oversized"
            exit 1
          fi
